[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "curriculum-dsbm"
version = "0.1.0"
description = "Curriculum-Enhanced alpha-DSBM for unpaired data translation under constrained compute"
authors = [
    {name = "Faissal Izermine"},
    {name = "Dhia Garbaya"},
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
